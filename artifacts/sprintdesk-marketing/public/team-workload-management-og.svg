    <text x="96" y="238" fill="#E7F0FA" font-size="45" font-weight="700">See who’s carrying</text>
    <text x="96" y="289" fill="#E7F0FA" font-size="45" font-weight="700">the work.</text>
    <text x="96" y="335" fill="#B9C9DB" font-size="18">Understand active ownership, sprint context,</text>
    <text x="96" y="362" fill="#B9C9DB" font-size="18">and blockers without chasing updates.</text>
