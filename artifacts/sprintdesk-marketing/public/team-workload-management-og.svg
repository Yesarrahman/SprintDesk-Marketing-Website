<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Team workload management software — SprintDesk</title>
  <desc id="desc">A SprintDesk workload view showing active ownership, sprint progress, and blockers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D2440"/>
      <stop offset="1" stop-color="#173A63"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BA4D0"/>
      <stop offset="1" stop-color="#E7F0FA"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="560" r="240" fill="#7BA4D0" opacity=".08"/>
